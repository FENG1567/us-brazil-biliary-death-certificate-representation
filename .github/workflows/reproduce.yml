name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  aggregate-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
          use-public-rspm: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpoppler-cpp-dev \
            cmake \
            libcurl4-openssl-dev \
            libjpeg-dev \
            libx11-dev
      - uses: r-lib/actions/setup-renv@v2
      - name: Reproduce and verify
        run: Rscript run_all.R all
      - name: Upload generated QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-output
          path: |
            results/generated
            figures/generated
